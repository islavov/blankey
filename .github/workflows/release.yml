name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to (e.g. v0.1.0); builds the commit the workflow runs on
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-latest
          - name: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - uses: astral-sh/setup-uv@v7

      - name: Check the tag matches the version
        run: |
          version=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match pyproject version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: uv sync

      - name: Build macOS
        if: startsWith(matrix.name, 'macos')
        run: |
          ./scripts/build_mac.sh
          mv dist/Blankey-$VERSION.dmg dist/upload-Blankey-$VERSION-${{ matrix.name }}.dmg

      - name: Build Windows
        if: startsWith(matrix.name, 'windows')
        run: |
          uv run briefcase package windows --adhoc-sign --no-input
          mv dist/Blankey-$VERSION.msi dist/upload-Blankey-$VERSION-${{ matrix.name }}.msi

      - name: Build Linux
        if: startsWith(matrix.name, 'linux')
        # Debian 13 ships Python 3.13, which the app needs; the package also installs on Ubuntu 25.04+
        run: |
          uv run briefcase package linux system --target debian:trixie --no-input
          mv dist/*.deb dist/upload-Blankey-$VERSION-${{ matrix.name }}.deb

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/upload-*; do
            target="dist/${file#dist/upload-}"
            mv "$file" "$target"
            gh release upload "$TAG" "$target" --clobber
          done

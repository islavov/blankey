name: Release

# A pushed version tag makes a draft release, builds, uploads, and publishes it last: installed apps look for updates
# in the latest published release, so a release must not be the latest before its installers and latest.json are on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to upload to (e.g. v0.1.0); empty builds artifacts only
        required: false
      targets:
        description: Which installers to build, a comma list of macos, windows, deb, rpm
        required: false
        default: all

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version
        if: env.TAG != ''
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match tauri.conf.json version $version"; exit 1; }

  # The release the installers go to, unpublished until they are on it; its notes are the version's changelog section
  draft:
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
          awk -v v="${TAG#v}" '$0 == "## " v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --draft --verify-tag --title "Blankey ${TAG#v}" --notes-file notes.md --repo "$GITHUB_REPOSITORY"

  # Runs alongside the builds; only the upload waits for it
  test:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  macos:
    needs: version
    if: ${{ !inputs.targets || inputs.targets == 'all' || contains(inputs.targets, 'macos') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2 cargo-about
        # signed-in lookups: anonymous ones hit the API rate limit and fall back to slow source builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: scripts/build_mac.sh
        env:
          BLANKEY_TELEMETRY_KEY: ${{ secrets.BLANKEY_TELEMETRY_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: blankey-macos-aarch64
          path: dist/*

  windows:
    needs: version
    if: ${{ !inputs.targets || inputs.targets == 'all' || contains(inputs.targets, 'windows') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2 cargo-about
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - shell: pwsh
        run: ./scripts/build_windows.ps1
        env:
          BLANKEY_TELEMETRY_KEY: ${{ secrets.BLANKEY_TELEMETRY_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: blankey-windows-x86_64
          path: dist/*

  deb:
    needs: version
    if: ${{ !inputs.targets || inputs.targets == 'all' || contains(inputs.targets, 'deb') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "ubuntu:26.04"]
    container: ${{ matrix.image }}
    steps:
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.image }}
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2 cargo-about
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: scripts/build_deb.sh --install-deps
        env:
          BLANKEY_TELEMETRY_KEY: ${{ secrets.BLANKEY_TELEMETRY_KEY }}
      - id: name
        run: echo "artifact=blankey-deb-$(echo '${{ matrix.image }}' | tr ':' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist/*

  rpm:
    needs: version
    if: ${{ !inputs.targets || inputs.targets == 'all' || contains(inputs.targets, 'rpm') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "almalinux:10"]
    container: ${{ matrix.image }}
    steps:
      - name: Base tools
        run: dnf install -y curl ca-certificates gcc git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.image }}
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2 cargo-about
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: scripts/build_rpm.sh --install-deps
        env:
          BLANKEY_TELEMETRY_KEY: ${{ secrets.BLANKEY_TELEMETRY_KEY }}
      - id: name
        run: . /etc/os-release && echo "artifact=blankey-rpm-$ID${VERSION_ID%%.*}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist/*

  upload:
    # runs after the selected builds; a skipped platform is fine, a failed one is not
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.ref_type == 'tag' || inputs.tag) }}
    needs: [draft, test, macos, windows, deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # what installed apps check for updates; only when both platforms that update themselves were built
      - name: Updater manifest
        if: needs.macos.result == 'success' && needs.windows.result == 'success'
        run: scripts/updater-manifest.sh "$TAG" "$GITHUB_REPOSITORY"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to (e.g. v0.1.0); empty builds artifacts only
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: Check the tag matches the version
        if: env.TAG != ''
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match tauri.conf.json version $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: scripts/fetch-pdfium.sh
      - working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2 cargo-about
      - run: scripts/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: blankey-macos-aarch64
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2 cargo-about
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: blankey-windows-x86_64
          path: dist/*

  deb:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "ubuntu:26.04"]
    container: ${{ matrix.image }}
    steps:
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential git
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.image }}
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2 cargo-about
      - run: scripts/build_deb.sh --install-deps
      - id: name
        run: echo "artifact=blankey-deb-$(echo '${{ matrix.image }}' | tr ':' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist/*

  upload:
    if: github.event.release.tag_name || inputs.tag
    needs: [macos, windows, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

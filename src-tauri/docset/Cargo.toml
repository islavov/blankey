[package]
name = "docset"
version = "0.1.0"
description = "Writes and checks document config sets with the app's engine: a developer's tool, not shipped"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
blankey-doctypes = { path = "../doctypes" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
base64 = "0.22"
regex = "1"

[dev-dependencies]
blankey-doctypes = { path = "../doctypes", features = ["example"] }
tempfile = "3"

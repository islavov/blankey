# English labels. Labels and tokens match case-insensitively on word boundaries; org suffixes are case-sensitive.
lang: en
months: [january, february, march, april, may, june, july, august, september, october, november, december]
anchors:
  - { kind: ssn, labels: [ssn, social security no., social security number], value: { pattern: ssn_plain } }
  - { kind: nino, labels: [national insurance no., national insurance number, ni number], value: { pattern: nino } }
  - { kind: passport, labels: [passport no., passport number, passport], value: { pattern: passport } }
  - { kind: id_card, labels: [id card no., id no., identity card no., id number], value: { pattern: id_card } }
  - { kind: birth_date, labels: [date of birth, dob, born on], value: { pattern: date } }
  - { kind: address, labels: [residing at, resident at, address, registered office at, registered address, of address], value: { grammar: address } }
  - { kind: person, labels: [mr., mrs., ms., dr., name, full name, signed by], value: { grammar: person_name } }
  - { kind: representative, labels: [represented by, acting through its director, director], value: { grammar: person_name } }
  - { kind: iban, labels: [iban, bank account, account no.], value: { pattern: iban } }
  - { kind: bic, labels: [bic, swift], value: { pattern: bic } }
  - { kind: phone, labels: [tel., tel, phone, telephone, mobile], value: { grammar: phone_any } }
  - { kind: email, labels: [email, e-mail], value: { pattern: email } }
  - { kind: postcode, labels: [zip, zip code, postcode, post code], value: { regex: '[A-Z0-9]{2,4} ?[A-Z0-9]{3}|\d{5}(?:-\d{4})?' } }
  - { kind: eik, labels: [company id, company no., company number, registration no.], value: { pattern: eik } }
person_before: [ssn, born on, date of birth, holder of passport, passport no.]
glue: [with]
address_tokens: [street, st., avenue, ave., road, rd., lane, ln., drive, dr., boulevard, blvd., court, ct., place, pl.,
                 square, sq., suite, apt., apartment, unit, floor, flat, building, po box]
address_starts: [street, st., avenue, ave., road, rd., lane, drive, boulevard, blvd., square, flat, apt., suite]
org_suffixes: [Ltd, LTD, Limited, LLC, Inc, Corp, PLC, plc, GmbH, LLP, AG, SA, SRL, BV]
roles:
  seller: [seller, vendor]
  buyer: [buyer, purchaser]
  landlord: [landlord, lessor]
  tenant: [tenant, lessee]
  employer: [employer]
  employee: [employee]
  principal: [principal]
  agent: [agent, attorney-in-fact]
  client: [client, customer]
  contractor: [contractor, consultant, supplier]
  lender: [lender]
  borrower: [borrower]
  guarantor: [guarantor]
defined_term: '(?:hereinafter|hereafter)(?:\s+(?:referred\s+to\s+as|called))?'

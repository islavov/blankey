    heading: Поискайте да го попълни
    text: Шаблонът е готов. Асистентът избира откъде идва всяка стойност, без да вижда самите стойности.
    prompt: Попълни договора за заемодателя и заемателя
    done: { requests: 1, fill_sets: 1 }
  - title: Проверете и генерирайте
    heading: Проверете стойностите и генерирайте
    text: Blankey показва попълнения договор, за да го проверите. Поправете каквото не е наред и натиснете „Запази и генерирай“.
    action: open_fill
    done: { documents: 1 }

[package]
name = "blankey-doctypes"
version = "0.1.0"
description = "The engine that reads known documents from a page's text lines with a document config set"
license = "MIT"
edition = "2021"

[features]
# the invented config set the engine's own tests run on, for the tests of what uses the engine
example = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
# OCR of scans and photos (ocr): the image decoders, and a pure-Rust runtime for the ONNX models
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tract-onnx = { version = "0.23", default-features = false }

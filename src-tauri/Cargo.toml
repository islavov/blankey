[package]
name = "blankey"
version = "0.2.5"
description = "Local encrypted PII vault and document templating with an MCP server"
license = "MIT"
edition = "2021"
default-run = "blankey"

[lib]
name = "blankey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
argon2 = "0.5"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
data-encoding = "2"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
unicode-normalization = "0.1"
thiserror = "2"
anyhow = "1"
regex = "1"
rust_decimal = "1"
minijinja = { version = "2", features = ["loader"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
lopdf = "0.38"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
ttf-parser = "0.25"
subsetter = "0.2"
tiny-skia = "0.11"
ab_glyph = "0.2"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["embedded-fonts", "scan-fonts", "universe-packages", "system-packages", "system-downloader", "system-files"] }
axum = "0.8"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "base64", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["indexmap2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
ureq = "2"
open = "5"
notify = "8"
uuid = { version = "1", features = ["v4"] }
toml = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
gethostname = "1"
sys-locale = "0.3"
tauri-plugin-updater = "2"
semver = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring / KWallet), like the Python keyring package
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-local-authentication = "0.3"
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

# Argon2 (64 MiB), PDF and Typst work are unbearably slow unoptimized
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

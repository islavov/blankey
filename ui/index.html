<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blankey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gate" class="gate hidden" data-tauri-drag-region>
    <div class="gate-card">
      <img src="icon.png" alt="" class="gate-icon">
      <h1 id="gate-title">Blankey</h1>
      <p id="gate-text" class="muted"></p>
      <form id="gate-form" autocomplete="off"></form>
      <p id="gate-error" class="error"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-top" data-tauri-drag-region></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="mcp-status" class="small muted"></div>
        <button id="lock-btn" class="ghost" title="Lock the vault">
          <svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="7" rx="1.5" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          Lock
        </button>
      </div>
    </aside>
    <main class="main">
      <header class="toolbar" data-tauri-drag-region>
        <div class="toolbar-titles" data-tauri-drag-region>
          <h2 id="page-title" data-tauri-drag-region></h2>
          <div id="page-subtitle" class="muted small" data-tauri-drag-region></div>
        </div>
        <div class="toolbar-actions">
          <span id="page-actions"></span>
          <input id="search" type="search" placeholder="Search" spellcheck="false">
        </div>
      </header>
      <section id="page" class="page"></section>
    </main>
  </div>

  <div id="sheet" class="sheet hidden"></div>
  <div id="modal" class="modal hidden">
    <form id="modal-form" class="modal-card" autocomplete="off"></form>
  </div>
  <div id="menu" class="menu hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
